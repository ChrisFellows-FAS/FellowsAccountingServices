<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Form detection</title>
</head>
<body>
  <!-- Static copy so Netlify can register the form at deploy time. Not linked in the site. -->
  <form name="discovery-call" method="POST" netlify data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="discovery-call">
    <p class="hidden"><label>Don’t fill this out: <input name="bot-field"></label></p>
    <input type="text" name="name">
    <input type="email" name="email">
    <input type="text" name="company">
    <textarea name="message"></textarea>
    <input type="hidden" name="subject" value="Discovery call request — Fellows Accounting Solutions">
  </form>
</body>
</html>
